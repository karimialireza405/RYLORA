[package]
name = "rylora"
version = "0.1.0"
description = "RYLORA — premium offline-first desktop music player"
authors = ["RYLORA"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "rylora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
blake3 = "1.8"
walkdir = "2.5"
ebur128 = "0.1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Optimise dependencies (decoders, image resizing) even in dev builds so playback and
# scanning behave realistically while the app crate itself stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
