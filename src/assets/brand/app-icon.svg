<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2033"/>
      <stop offset="1" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#6E93FF"/>
      <stop offset="0.55" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#A473FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7A6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#tile)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="215.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <!-- Open ring: a groove that resolves into a sustained note -->
  <path d="M 512 262 A 250 250 0 1 1 293 632" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>
  <path d="M 512 372 A 140 140 0 1 1 383 566" fill="none" stroke="url(#ring)" stroke-width="40" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle cx="512" cy="512" r="46" fill="#F5F7FF"/>
</svg>
